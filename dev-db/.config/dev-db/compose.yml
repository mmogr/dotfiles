# Dev databases. Ports bind to loopback only: the default credentials below are
# fine for localhost and nothing else. Data dirs are created by podman-stack
# (the helper behind pgup/myup/dbdown); the ${HOME}/.local/share path is
# hardcoded because podman-compose cannot expand nested ${VAR:-${HOME}/...}
# defaults.
services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: dev-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ${HOME}/.local/share/dev-db/postgres:/var/lib/postgresql/data:U

  mysql:
    image: docker.io/library/mysql:26.7
    container_name: dev-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - ${HOME}/.local/share/dev-db/mysql:/var/lib/mysql:U
