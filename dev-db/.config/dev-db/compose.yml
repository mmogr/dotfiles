# Dev databases. Ports bind to loopback only: the default credentials below are
# fine for localhost and nothing else. Data dirs are created by podman-stack
# (the helper behind pgup/myup/dbdown); the ${HOME}/.local/share path is
# hardcoded because podman-compose cannot expand nested ${VAR:-${HOME}/...}
# defaults.
services:
  postgres:
    image: docker.io/library/postgres:18
    container_name: dev-postgres
    ports:
      - "127.0.0.1:5432:5432"
    labels:
      # Printed by podman-stack after pgup (keep in sync with ports above).
      dotfiles.access: |
        Postgres → postgresql://postgres:postgres@localhost:5432/postgres  (default password)
          psql: podman exec -it dev-postgres psql -U postgres   stop: dbdown
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Postgres 18+ keeps data in a per-version subdir (/var/lib/postgresql/<major>/docker).
      # A major bump needs pg_upgrade or a fresh dir; the container refuses old data.
      - ${HOME}/.local/share/dev-db/postgres:/var/lib/postgresql:U

  mysql:
    image: docker.io/library/mysql:26.10
    container_name: dev-mysql
    ports:
      - "127.0.0.1:3306:3306"
    labels:
      # Printed by podman-stack after myup (keep in sync with ports above).
      dotfiles.access: |
        MySQL → mysql://root:root@127.0.0.1:3306/  (default password)
          client: podman exec -it dev-mysql mysql -uroot -p   stop: dbdown
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - ${HOME}/.local/share/dev-db/mysql:/var/lib/mysql:U
