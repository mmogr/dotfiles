# Open WebUI. Image is pinned to a release tag (Renovate opens bump PRs).
# Data dir is created by podman-stack (the helper behind uiup/uidown).
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: open-webui
    restart: always
    ports:
      # Loopback only — WEBUI_AUTH is off below.
      - "127.0.0.1:3000:8080"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    env_file:
      - .env
    environment:
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      - WEBUI_AUTH=False
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - OPENAI_API_BASE_URL=http://host.containers.internal:8080/v1
    volumes:
      - ${HOME}/.local/share/open-webui/data:/app/backend/data:U
